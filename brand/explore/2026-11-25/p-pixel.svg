<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- P · Pixel climber: 4px grid belayer holding a rope. Brand mascot energy. -->
  <g fill="#F5F5F3">
    <!-- helmet -->
    <rect x="20" y="8" width="24" height="4"/>
    <rect x="16" y="12" width="32" height="16"/>
    <!-- brim -->
    <rect x="12" y="28" width="40" height="4"/>
    <!-- torso -->
    <rect x="24" y="32" width="16" height="16"/>
    <!-- left arm -->
    <rect x="16" y="36" width="8" height="4"/>
    <!-- right arm + rope -->
    <rect x="40" y="36" width="8" height="4"/>
    <rect x="44" y="40" width="4" height="16"/>
    <!-- legs -->
    <rect x="24" y="48" width="6" height="12"/>
    <rect x="34" y="48" width="6" height="12"/>
    <!-- rope knot -->
    <rect x="42" y="56" width="8" height="4"/>
  </g>
  <!-- eyes -->
  <g fill="#000000">
    <rect x="22" y="18" width="6" height="6"/>
    <rect x="36" y="18" width="6" height="6"/>
  </g>
</svg>
